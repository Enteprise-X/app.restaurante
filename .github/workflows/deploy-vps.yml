name: Deploy VPS

on:
  push:
    branches:
      - production
  workflow_dispatch:

concurrency:
  group: deploy-vps-app-restaurante
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_GATEWAY_AMBIENTE: homolog
          VITE_ORION_AMBIENTE: homolog
          VITE_BASE_PATH: /orion/
          VITE_APP_NOME_EMPRESA: Enterprise X
          VITE_APP_NOME_APP: Orion
          VITE_APP_SIGLA_SISTEMA: ORI
          VITE_APP_SECRET_TOKEN_QR: ${{ secrets.FRONTEND_SECRET_TOKEN }}

      - name: Upload dist
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          source: "dist/*"
          target: /tmp/orion-dist
          strip_components: 1

      - name: Publish on nginx
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script_stop: true
          script: |
            set -e
            mkdir -p /var/www/enterprise-apps/orion
            rm -rf /var/www/enterprise-apps/orion/*
            cp -a /tmp/orion-dist/. /var/www/enterprise-apps/orion/
            chown -R www-data:www-data /var/www/enterprise-apps
            CONF=/etc/nginx/sites-available/enterprise.lumenemotion.com.br
            if ! grep -q 'location /orion/' "$CONF"; then
              python3 - <<'PY'
            from pathlib import Path
            path = Path('/etc/nginx/sites-available/enterprise.lumenemotion.com.br')
            text = path.read_text()
            snippet = '''
                location /orion/ {
                    root /var/www/enterprise-apps;
                    try_files $uri $uri/ /orion/index.html;
                }

            '''
            marker = '    location / {'
            idx = text.find(marker)
            if idx < 0:
                raise SystemExit('marker not found in enterprise nginx conf')
            path.write_text(text[:idx] + snippet + text[idx:])
            print('Inserted /orion/ location')
            PY
            fi
            nginx -t
            systemctl reload nginx
            curl -sI https://127.0.0.1/orion/ -H 'Host: enterprise.lumenemotion.com.br' -k | head -8
